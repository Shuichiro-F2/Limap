    <!-- 構造化データ(schema.org): サイト全体のWebSite/Organization情報。
         個別の投稿ページの構造化データ(Place)は /api/spot.ts が投稿ごとに動的に埋め込む。 -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "LIMap（リマップ）",
        "url": "https://limap.jp/",
        "description": "日本各地の廃墟や無人駅、地下通路など「リミナルスペース」を写真と場所で探し、記録・共有できる地図アプリ。",
        "inLanguage": "ja",
        "publisher": {
          "@type": "Organization",
          "name": "LIMap",
          "url": "https://limap.jp/",
          "logo": "https://limap.jp/apple-touch-icon.png"
        }
      }
    </script>

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* ホーム画面に追加してスタンドアロン表示にした際、ノッチ/ホームインジケーター分の
         セーフエリア(env(safe-area-inset-*))が各画面のレイアウト計算で反映されるまでの間や
         万一余白がずれた場合でも、下地が白く見えないようにアプリの背景色で塗っておく。 */
      html,
      body {
        background-color: #1a1a1a;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!-- LIMap: JSバンドルの読み込み〜Reactのマウントが終わるまで表示するロード画面 -->
    <style id="limap-splash-style">
      #limap-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #1a1a1a;
        transition: opacity 0.35s ease;
      }
      #limap-splash.limap-splash-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #limap-splash img {
        width: 200px;
        height: auto;
        margin-bottom: 32px;
      }
      #limap-splash .limap-loading-track {
        width: 160px;
        height: 4px;
        border-radius: 2px;
        background-color: rgba(255, 255, 255, 0.15);
        overflow: hidden;
      }
      #limap-splash .limap-loading-bar {
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background-color: #dece32;
        animation: limap-loading 1.1s ease-in-out infinite;
      }
      @keyframes limap-loading {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(350%);
        }
      }
    </style>
    <!-- LIMap: サーバー側で #root に入れる本文(#limap-ssr)の見た目。
         トップ(scripts/build-top-page.js)・スポット(api/spot.ts)・読み物ページ(api/page.ts)で共通。
         通常はロード画面に隠れたままReactに置き換わるため、主にJS無効時の表示用。 -->
    <style id="limap-ssr-style">
      #limap-ssr { max-width: 720px; margin: 0 auto; padding: 24px 16px; color: #e8e8e8; line-height: 1.8; }
      #limap-ssr img { max-width: 100%; height: auto; display: block; margin: 16px 0; }
      #limap-ssr a { color: #dece32; }
      #limap-ssr ul { padding-left: 1.2em; }
      #limap-ssr dt { margin-top: 12px; opacity: 0.7; }
      #limap-ssr dd { margin: 0; }
      #limap-ssr article { border-top: 1px solid #333; margin-top: 16px; padding-top: 8px; }
      #limap-ssr .limap-ssr-meta { opacity: 0.7; font-size: 0.9em; }
    </style>
    <!-- JS無効時はロード画面が消えず本文を覆ってしまうため隠し、長い本文をスクロールできるようにする -->
    <noscript>
      <style>
        #limap-splash { display: none; }
        body { overflow: auto; }
        #root { display: block; height: auto; }
      </style>
    </noscript>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>

    <!-- LIMap: ロゴ＋ローディングバーのロード画面。Reactのマウントを検知したら自動的にフェードアウトする -->
    <div id="limap-splash">
      <img src="/splash-logo.png" alt="LIMap" />
      <div class="limap-loading-track">
        <div class="limap-loading-bar"></div>
      </div>
    </div>

    <!-- The root element for your Expo app. -->
    <div id="root"></div>

    <script>
      (function () {
        var splash = document.getElementById('limap-splash');
        var root = document.getElementById('root');
        if (!splash || !root) return;

        // このあとオープニング演出(黄色い画面)が続けて再生されるかどうか。
        // src/lib/firstLaunch.ts の shouldPlayIntro() と同じ条件・同じキーを見ている
        // (静的HTML側からアプリのコードを読めないため、ここだけ二重管理になっている)。
        function willPlayIntro() {
          try {
            var p = window.location.pathname;
            var onIntroPath = p === '/' || p === '' || /^\/spot\/[^/]+\/?$/.test(p);
            return onIntroPath && window.sessionStorage.getItem('limap-intro-played') !== '1';
          } catch (e) {
            return false;
          }
        }

        // 演出として、実際のロードが早く終わっても最低これだけは表示し続ける。
        // ただし直後にオープニング演出が続く場合は、暗い画面 → 黄色い画面と
        // スプラッシュが二重に見えてしまうため、Reactがマウントし次第すぐ引き渡す。
        var MIN_DISPLAY_MS = willPlayIntro() ? 0 : 1200;
        var startTime = Date.now();
        var mounted = false;
        var removed = false;

        function doHide() {
          if (removed) return;
          removed = true;
          splash.classList.add('limap-splash-hidden');
          setTimeout(function () {
            if (splash.parentNode) splash.parentNode.removeChild(splash);
          }, 400);
        }

        function hideSplash() {
          if (!mounted) return;
          var remaining = MIN_DISPLAY_MS - (Date.now() - startTime);
          if (remaining > 0) {
            setTimeout(doHide, remaining);
          } else {
            doHide();
          }
        }

        var observer = new MutationObserver(function () {
          if (root.childNodes.length > 0) {
            mounted = true;
            hideSplash();
            observer.disconnect();
          }
        });
        observer.observe(root, { childList: true });

        // 万一Reactのマウントを検知できなかった場合の保険（10秒でタイムアウト）
        setTimeout(function () {
          mounted = true;
          hideSplash();
        }, 10000);
      })();
    </script>
  </body>
</html>
