<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!-- LIMap: JSバンドルの読み込み〜Reactのマウントが終わるまで表示するロード画面 -->
    <style id="limap-splash-style">
      #limap-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #404040;
        transition: opacity 0.35s ease;
      }
      #limap-splash.limap-splash-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #limap-splash img {
        width: 200px;
        height: auto;
        margin-bottom: 32px;
      }
      #limap-splash .limap-loading-track {
        width: 160px;
        height: 4px;
        border-radius: 2px;
        background-color: rgba(255, 255, 255, 0.15);
        overflow: hidden;
      }
      #limap-splash .limap-loading-bar {
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background-color: #dece32;
        animation: limap-loading 1.1s ease-in-out infinite;
      }
      @keyframes limap-loading {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(350%);
        }
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>

    <!-- LIMap: ロゴ＋ローディングバーのロード画面。Reactのマウントを検知したら自動的にフェードアウトする -->
    <div id="limap-splash">
      <img src="/splash-logo.png" alt="LIMap" />
      <div class="limap-loading-track">
        <div class="limap-loading-bar"></div>
      </div>
    </div>

    <!-- The root element for your Expo app. -->
    <div id="root"></div>

    <script>
      (function () {
        var splash = document.getElementById('limap-splash');
        var root = document.getElementById('root');
        if (!splash || !root) return;

        var removed = false;
        function hideSplash() {
          if (removed) return;
          removed = true;
          splash.classList.add('limap-splash-hidden');
          setTimeout(function () {
            if (splash.parentNode) splash.parentNode.removeChild(splash);
          }, 400);
        }

        var observer = new MutationObserver(function () {
          if (root.childNodes.length > 0) {
            hideSplash();
            observer.disconnect();
          }
        });
        observer.observe(root, { childList: true });

        // 万一Reactのマウントを検知できなかった場合の保険（10秒でタイムアウト）
        setTimeout(hideSplash, 10000);
      })();
    </script>
  </body>
</html>
